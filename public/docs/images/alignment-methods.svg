<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none"><title>Choosing an alignment method</title><desc>Point to point translates one picked point onto another. Point to plane projects onto a plane. Plane to plane uses both location and face direction.</desc><rect width="1200" height="480" fill="#202226"/><g font-family="Inter,Arial,sans-serif"><text x="40" y="48" fill="#e2e4e8" font-size="22" font-weight="600">Choose what the geometry tells you</text><g stroke="#34373d"><path d="M399 100v310M800 100v310"/></g><g stroke-width="2"><path d="m100 178 83-31 50 73-86 33Z" fill="#473426" stroke="#ed9f60"/><path d="m205 277 83-31 50 73-86 33Z" fill="#2c4039" stroke="#9bbdb2"/><circle cx="180" cy="207" r="6" fill="#ed9f60"/><circle cx="283" cy="305" r="6" fill="#9bbdb2"/><path d="m190 217 80 76m-1-12 1 12-12-1" stroke="#d4d8df" stroke-dasharray="5 5"/><path d="m498 294 173-52 73 58-169 55Z" fill="#2c4039" stroke="#9bbdb2"/><circle cx="575" cy="175" r="6" fill="#ed9f60"/><circle cx="575" cy="313" r="6" fill="#9bbdb2"/><path d="M575 188v109m-7-9 7 9 7-9" stroke="#d4d8df" stroke-dasharray="5 5"/><path d="M575 313v-75m-7 10 7-10 7 10" stroke="#9bbdb2"/><path d="m914 182 151-33 39 62-150 33Z" fill="#473426" stroke="#ed9f60"/><path d="m916 293 169-42 62 59-170 43Z" fill="#2c4039" stroke="#9bbdb2"/><path d="m1002 201-16-60m-4 11 4-11 9 7" stroke="#ed9f60"/><path d="m1030 314 15 54m4-11-4 11-9-7" stroke="#9bbdb2"/><path d="M968 255q-65-14-46-60m-12 9 12-9 2 14" stroke="#d4d8df" stroke-dasharray="5 5"/></g><g fill="#e2e4e8" font-size="18" font-weight="550"><text x="40" y="393">Point to point</text><text x="440" y="393">Point to plane</text><text x="840" y="393">Plane to plane</text></g><g fill="#aeb3bd" font-size="14"><text x="40" y="424">Match location; retain orientation.</text><text x="440" y="424">Project along the target normal.</text><text x="840" y="424">Seat and orient the picked faces.</text></g><circle cx="940" cy="45" r="5" fill="#ed9f60"/><text x="953" y="50" fill="#c4c8d0" font-size="12">Moving</text><circle cx="1043" cy="45" r="5" fill="#9bbdb2"/><text x="1056" y="50" fill="#c4c8d0" font-size="12">Target</text></g></svg>
