<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none"><title>Flush fitting across multiple seams</title><desc>A moving central panel is fitted to two stationary neighbors using painted patches on both sides of each seam. Fitting balances surface height and outward normal, retaining sideways spacing.</desc><rect width="1200" height="480" fill="#202226"/><g font-family="Inter,Arial,sans-serif"><text x="42" y="49" fill="#e2e4e8" font-size="22" font-weight="600">One rigid fit. Every painted seam.</text><text x="42" y="80" fill="#aeb3bd" font-size="15">Paint small, locally flat areas on each side of the gaps.</text><g stroke-width="2"><path d="M80 255h230v70H80Z" fill="#30343b" stroke="#6e7580"/><path d="M337 224 650 177v70l-313 47Z" fill="#493529" stroke="#ed9f60"/><path d="M680 255h230v70H680Z" fill="#30343b" stroke="#6e7580"/><path d="M337 255h313v70H337Z" fill="#9bbdb210" stroke="#9bbdb2" stroke-dasharray="6 5"/><path d="M271 255h38m29-30 40-6M613 182l37-5m30 78h40" stroke="#9bbdb2" stroke-width="9"/><path d="M365 142q100-55 184 0m-12-2 12 2-6-11" stroke="#e2e4e8"/><path d="M997 188v95m-8-12 8 12 8-12" stroke="#9bbdb2"/></g><g fill="#c4c8d0" font-size="14"><text x="120" y="362">Stationary neighbor A</text><text x="398" y="362">Moving part</text><text x="710" y="362">Stationary neighbor B</text></g><g fill="#9bbdb2" font-size="12"><text x="271" y="393">Seam 1</text><text x="632" y="393">Seam 2</text><text x="936" y="314">Height + tilt</text></g><path d="M85 422h827" stroke="#34373d"/><text x="85" y="450" fill="#a0a5af" font-size="13">Orange: initial part · Mint dashed outline: fitted preview · Sideways gaps are preserved</text></g></svg>
