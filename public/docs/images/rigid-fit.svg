<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none"><title>Rigid anchors and residual gaps</title><desc>Three world-space targets influence a rigid part equally. Incompatible targets leave measurable residual gaps; the geometry is never stretched to reach them.</desc><rect width="1200" height="480" fill="#202226"/><g font-family="Inter,Arial,sans-serif"><text x="42" y="49" fill="#e2e4e8" font-size="22" font-weight="600">Move the targets. Keep the part rigid.</text><text x="42" y="80" fill="#aeb3bd" font-size="15">Every anchor contributes equally to the best achievable position and orientation.</text><path d="m190 210 265-30-78 199Z" fill="#3f3025" stroke="#ed9f60" stroke-width="2"/><path d="m209 190 266-28-72 196Z" fill="none" stroke="#6b737e" stroke-width="1.5" stroke-dasharray="6 6"/><g stroke="#9bbdb2" stroke-width="1.6"><circle cx="209" cy="190" r="15"/><circle cx="475" cy="162" r="15"/><circle cx="403" cy="358" r="15"/></g><g fill="#202226" stroke="#ed9f60" stroke-width="3"><circle cx="190" cy="210" r="5"/><circle cx="455" cy="180" r="5"/><circle cx="377" cy="379" r="5"/></g><g stroke="#c4c8d0" stroke-width="1.5"><path d="m190 210 19-20m246-10 20-18m-98 217 26-21"/></g><g fill="#cee0d8" font-size="10" text-anchor="middle"><text x="209" y="194">1</text><text x="475" y="166">2</text><text x="403" y="362">3</text></g><g font-size="15"><circle cx="713" cy="173" r="12" stroke="#9bbdb2" stroke-width="1.6"/><text x="743" y="178" fill="#e2e4e8">Target: fixed in world space</text><circle cx="713" cy="225" r="5" fill="#ed9f60"/><text x="743" y="230" fill="#e2e4e8">Attachment: follows the rigid part</text><path d="M701 277h24" stroke="#c4c8d0" stroke-width="1.5"/><text x="743" y="282" fill="#e2e4e8">Residual: the remaining gap</text></g><rect x="685" y="320" width="445" height="90" rx="5" fill="#232b29" stroke="#3c5149"/><text x="706" y="352" fill="#cee0d8" font-size="14">Incompatible targets do not deform the mesh.</text><text x="706" y="378" fill="#b5c4bf" font-size="13">Read the residuals; adjust targets and check the join.</text><text x="42" y="447" fill="#a0a5af" font-size="12">Schematic illustration · residual distances exaggerated for clarity</text></g></svg>
